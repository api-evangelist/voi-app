aid: voi-app
name: Voi
description: >-
  Voi Technology is a Stockholm-based shared micromobility operator
  founded in August 2018 by Fredrik Hjelm, Adam Jafer, Filip Lindvall, and
  Douglas Stark. The company runs Europe's largest shared e-scooter and
  e-bike fleet, with 150,000+ vehicles deployed across 110+ towns and
  cities in 13 European countries, serving 8+ million riders who have
  completed 400+ million trips. Voi has been EBIT-profitable since 2024
  and in 2026 unveiled a refreshed vehicle family including a new
  e-scooter model and two upgraded e-bikes, with first deployments in
  Stockholm. Voi exposes a public Partner API surface (MaaS Light and
  MaaS Pro) and standards-based open mobility feeds — GBFS v2/v3 for
  vehicle locations and system information, and MDS 0.4 for trips, status
  changes, and events — used by cities and MaaS aggregators across
  Europe. The Partner API also covers user registration, rental
  lifecycle (start/end), vehicle and zone discovery, pricing, payments,
  deeplinks, asset access, and customer support flows. Voi additionally
  publishes a GitHub organization (github.com/voiapp) hosting partner
  API docs, an iOS networking layer, a VIPER framework, an MDS fork, and
  internal tooling.
