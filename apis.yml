apis:
  - aid: voi-app:voi-maas-light-api
    name: Voi MaaS Light API
    description: >-
      Voi's read-only open mobility API surface, exposing GBFS v2/v3
      auto-discovery, system information, free bike status (with optional
      battery extension), and service areas, plus MDS 0.4 trips,
      status_changes, and events endpoints for historical and near
      real-time vehicle data. Authenticated via OAuth 2.0 client
      credentials at mds.voiapp.io/token. Used by cities, regulators,
      and MaaS aggregators to monitor Voi's fleet across European
      markets.
    humanURL: https://docs.voiscooters.com/maas-light/
    tags:
      - GBFS
      - MDS
      - Micromobility
      - Open Mobility
    properties:
      - url: https://docs.voiscooters.com/maas-light/
        type: Documentation
      - url: https://api.voiapp.io/gbfs/v2/gbfs.json
        type: BaseURL
      - url: https://mds.voiapp.io/
        type: BaseURL
      - url: https://api.voiapp.io/gbfs/v2/gbfs.json
        type: GBFS
      - url: https://github.com/MobilityData/gbfs/blob/master/systems.csv
        type: Registry
  - aid: voi-app:voi-maas-pro-api
    name: Voi MaaS Pro API
    description: >-
      Voi's commercial Partner API enabling MaaS partners to embed full
      ride journeys in their apps — register users, start and end
      rentals, look up active and historical rentals for a user,
      discover available vehicles by zone or scooter code, retrieve
      per-vehicle pricing, and read zone definitions (parking,
      slow-zones, operations). Authenticated via X-Auth-Token header
      tokens issued at partner onboarding.
    humanURL: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-pro.md
    tags:
